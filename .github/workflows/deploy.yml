name: Deploy

# Static site: website/ (plus the CV PDF built from cv/main.tex) goes to the b8v.dev/
# prefix of the shared static-sites bucket.
# Hosting (bucket, CloudFront, certificate, deploy role) lives in bleschunov/infra.
# Repo variables from `terraform output github_variables` there:
# AWS_ROLE_ARN, S3_BUCKET, S3_PREFIX, CLOUDFRONT_DISTRIBUTION_ID.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'cv/**'
      - '.github/workflows/deploy.yml'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  CV_PDF: dmitrii_bleshchunov_software_engineer.pdf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate posts.json
        run: |
          python3 - <<'EOF'
          import json, sys
          posts = json.load(open("website/posts.json"))
          required = {"post_id", "title", "posted_at", "content"}
          bad = [p.get("post_id", "?") for p in posts if not required <= p.keys()]
          ids = [p["post_id"] for p in posts]
          if bad or len(ids) != len(set(ids)):
              sys.exit(f"posts.json: missing fields in {bad} or duplicate post_id")
          print(f"{len(posts)} posts OK")
          EOF

      - name: Build CV PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: main.tex

      - name: Assemble site
        run: |
          cp cv/main.pdf "website/cv/$CV_PDF"
          printf '{"commit":"%s","deployed_at":"%s","run_url":"%s"}\n' \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > website/build.json
          cat website/build.json
          find website -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: website
          retention-days: 30

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: website

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 sync website/ "s3://${{ vars.S3_BUCKET }}/${{ vars.S3_PREFIX }}/" \
            --delete \
            --exclude ".DS_Store" \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
