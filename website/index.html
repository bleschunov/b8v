<script>
  // Winter decorations: Nov 1 – Jan 30, every year
  (function () {
    var d = new Date(), m = d.getMonth(), day = d.getDate();
    if (m === 10 || m === 11 || (m === 0 && day <= 30)) document.documentElement.classList.add('winter');
  })();
</script>
<style>
  :root {
    --navy: #131f2d;
    --orange: #f97316;
    --body-text: #2b2b2b;
    --divider: #e5e5e5;
    --muted: #8a8f98;
    --paper: #fdfdfb;
    --page: #f3f3f1;

    --pad: 20px;
    --icon-size: 32px;
  }

  @media (min-width: 768px) {
    :root { --pad: 64px; --icon-size: 40px; }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--body-text);
    font-family: 'Roboto Mono', 'Courier New', monospace;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px var(--pad);
    min-height: 100vh;
    border-top: 4px solid var(--orange);
  }

  /* ===== Card ===== */
  .card {
    container-type: inline-size;
    position: relative;
    width: min(880px, 100%);
    aspect-ratio: 1.75 / 1;
    background-color: var(--paper);
    /* laid-paper texture, like the printed card */
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(19, 31, 45, 0.035) 0px,
      rgba(19, 31, 45, 0.035) 1px,
      transparent 1px,
      transparent 4px
    );
    border-radius: 6px;
    box-shadow:
      0 1px 2px rgba(19, 31, 45, 0.08),
      0 12px 40px -12px rgba(19, 31, 45, 0.25);
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "logo   logo"
      "person person"
      "org    phone";
    padding: 7cqw 7.5cqw 6cqw 7.5cqw;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 1px 2px rgba(19, 31, 45, 0.08),
      0 18px 48px -14px rgba(19, 31, 45, 0.3);
  }

  /* ===== Logo (same animation as b8v.dev) ===== */
  .logo-row {
    grid-area: logo;
    display: flex;
    align-items: center;
    gap: 2.2cqw;
  }

  .b8v-logo {
    position: relative;
    display: inline-block;
    width: 10ch;
    height: 1.2em;
    font-weight: 700;
    font-size: 3.6cqw;
    line-height: 1.2;
    color: var(--navy);
    white-space: nowrap;
    letter-spacing: 0;
  }

  .b8v-logo span { position: absolute; top: 0; }
  .b8v-b { left: 0ch; }

  .b8v-eight {
    left: 1ch;
    color: var(--orange);
    animation: b8v-fade-out 0.4s ease forwards;
    animation-delay: 0.3s;
  }

  .b8v-v {
    left: 2ch;
    animation: b8v-slide-v 0.65s cubic-bezier(.65, 0, .35, 1) forwards;
    animation-delay: 0.75s;
  }

  .b8v-middle {
    opacity: 0;
    transform: translateY(4px);
    animation: b8v-fade-in-up 0.35s ease forwards;
  }
  .b8v-middle:nth-child(4)  { left: 1ch; animation-delay: 0.95s; }
  .b8v-middle:nth-child(5)  { left: 2ch; animation-delay: 1.00s; }
  .b8v-middle:nth-child(6)  { left: 3ch; animation-delay: 1.05s; }
  .b8v-middle:nth-child(7)  { left: 4ch; animation-delay: 1.10s; }
  .b8v-middle:nth-child(8)  { left: 5ch; animation-delay: 1.15s; }
  .b8v-middle:nth-child(9)  { left: 6ch; animation-delay: 1.20s; }
  .b8v-middle:nth-child(10) { left: 7ch; animation-delay: 1.25s; }
  .b8v-middle:nth-child(11) { left: 8ch; animation-delay: 1.30s; }

  @keyframes b8v-fade-out   { to { opacity: 0; } }
  @keyframes b8v-slide-v    { to { left: 9ch; } }
  @keyframes b8v-fade-in-up { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .b8v-eight { animation: none; opacity: 0; }
    .b8v-v { animation: none; left: 9ch; }
    .b8v-middle { animation: none; opacity: 1; transform: none; }
  }

  /* ===== Person ===== */
  .person {
    grid-area: person;
    align-self: center;
  }

  .name {
    margin: 0 0 1.2cqw;
    color: var(--navy);
    font-weight: 700;
    font-size: 3.6cqw;
    line-height: 1.2;
  }

  .role {
    margin: 0;
    color: var(--body-text);
    font-size: 2.2cqw;
    line-height: 1.5;
  }

  .role::before {
    content: "";
    display: inline-block;
    width: 2.4cqw;
    height: 2px;
    background: var(--orange);
    vertical-align: middle;
    margin-right: 1.2cqw;
    transform: translateY(-0.15em);
  }

  /* ===== Bottom block ===== */
  .org {
    grid-area: org;
    align-self: end;
    font-size: 1.95cqw;
    line-height: 1.7;
    color: var(--body-text);
    font-style: normal;
  }

  .org .entity { color: var(--navy); font-weight: 700; }

  .phone {
    grid-area: phone;
    align-self: end;
    font-size: 1.95cqw;
    line-height: 1.7;
    white-space: nowrap;
  }

  .card a {
    color: inherit;
    text-decoration: none;
    background-image: linear-gradient(var(--orange), var(--orange));
    background-size: 0% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    transition: background-size 0.25s ease, color 0.2s ease;
  }

  .card a:hover,
  .card a:focus-visible {
    color: var(--orange);
    background-size: 100% 1px;
    outline: none;
  }

  .phone .label { color: var(--muted); }

  /* ===== Below the card ===== */
  .actions {
    width: min(880px, 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .social-icons { display: flex; gap: 10px; }

  .social-icons a {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-weight: 700;
    font-size: calc(var(--icon-size) * 0.34);
    transition: background 0.2s ease;
  }

  .social-icons a:hover,
  .social-icons a:focus-visible { background: var(--orange); }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .save {
    display: inline-block;
    text-decoration: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--navy);
    background: transparent;
    border: 1.5px solid var(--navy);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .save:hover,
  .save:focus-visible {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    outline: none;
  }


  /* ===== Winter (only when <html class="winter">) ===== */
  html:not(.winter) .xmas,
  html:not(.winter) #snow,
  html:not(.winter) .drift { display: none; }
  html.winter body { border-top: 0; padding-top: 130px; }

  .xmas {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 170px;
    pointer-events: none;
    z-index: 5;
  }
  .xmas svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .branches { position: absolute; inset: 0; overflow: hidden; height: 140px; }
  .branches img {
    position: absolute;
    filter: drop-shadow(0 3px 3px rgba(19, 31, 45, 0.22));
    user-select: none;
  }

  .ornament {
    transform-box: view-box;
    animation: sway var(--dur, 5s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }
  @keyframes sway {
    from { transform: rotate(calc(var(--amp, 4deg) * -1)); }
    to   { transform: rotate(var(--amp, 4deg)); }
  }

  #snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 4;
  }

  .drift {
    position: absolute;
    top: -8px; left: -3px;
    width: calc(100% + 6px);
    height: 13px;
    pointer-events: none;
    filter: drop-shadow(0 -1px 1px rgba(143, 166, 191, 0.55));
  }

  @media (prefers-reduced-motion: reduce) {
    .ornament { animation: none; }
  }

  /* ===== Mobile: the card turns vertical ===== */
  @media (max-width: 640px) {
    .card {
      aspect-ratio: 0.62 / 1;
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto auto;
      grid-template-areas:
        "logo"
        "person"
        "org"
        "phone";
      padding: 11cqw 9cqw 10cqw;
    }

    .logo-row { gap: 3.5cqw; }
    .b8v-logo { font-size: 7.2cqw; }

    .person, .org { padding-left: 0; }
    .name { font-size: 7.2cqw; margin-bottom: 2.4cqw; }
    .role { font-size: 4.4cqw; }
    .role::before { width: 5cqw; margin-right: 2.4cqw; }

    .org, .phone { font-size: 3.9cqw; }
    .phone { margin-top: 2.4cqw; }

    .actions { justify-content: center; flex-direction: column; }
  }

  /* ===== Print: a real 85 × 55 mm card ===== */
  @media print {
    @page { size: 85mm 55mm; margin: 0; }
    body { background: #fff; padding: 0; border: 0; min-height: 0; display: block; }
    .card { width: 85mm; aspect-ratio: 85 / 55; box-shadow: none; border-radius: 0; background-image: none; }
    .actions, .xmas, #snow, .drift { display: none; }
    .b8v-eight { animation: none; opacity: 0; }
    .b8v-v { animation: none; left: 9ch; }
    .b8v-middle { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <script>

      ].join('\r\n');
      const blob = new Blob([vcf], { type: 'text/vcard' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dmitrii-bleshchunov.vcf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  </script>

  <script>
  (() => {
    if (!document.documentElement.classList.contains('winter')) return;
    const NS = 'http://www.w3.org/2000/svg';
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function rng(seed) {
      return () => {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const stemY = x => 22 + Math.sin(x / 95) * 4;

    /* ---- Fir garland from a CC0 branch (Openclipart, OlKu) ---- */
    function drawGarland(W) {
      const box = document.querySelector('.branches');
      const r = rng(5);
      const mobile = W < 640;
      const w = mobile ? 230 : 300, step = mobile ? 135 : 175;
      box.innerHTML = '';
      for (let x = -w * 0.45, i = 0; x < W; x += step * (0.85 + r() * 0.3), i++) {
        const img = new Image();
        img.src = '/fir-branch.svg';
        img.alt = '';
        img.width = w;
        const flip = i % 2 ? -1 : 1;
        const top = -(mobile ? 58 : 74) - r() * 12;
        img.style.cssText = `left:${x.toFixed(0)}px;top:${top.toFixed(0)}px;transform:scaleX(${flip}) rotate(${(r() * 10 - 5).toFixed(1)}deg);z-index:${1 + (i % 3)}`;
        box.appendChild(img);
      }
    }

    /* ---- Hanging baubles ---- */
    function drawBaubles(W) {
      const svg = document.querySelector('.ornaments');
      const mobile = W < 640;
      const k = mobile ? 0.75 : 1;
      svg.setAttribute('width', W);
      svg.setAttribute('viewBox', `0 0 ${W} 170`);
      let out = `<defs>
        <radialGradient id="g-orange" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb47a"/><stop offset=".45" stop-color="#f97316"/><stop offset="1" stop-color="#b44a06"/></radialGradient>
        <radialGradient id="g-navy" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#4b6a8c"/><stop offset=".45" stop-color="#1f3249"/><stop offset="1" stop-color="#0a1119"/></radialGradient>
        <radialGradient id="g-silver" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#dfe4ea"/><stop offset="1" stop-color="#9aa3ae"/></radialGradient>
      </defs>`;
      const r = rng(21);
      const colors = ['orange', 'navy', 'silver'];
      const gap = mobile ? 34 : 52;
      const list = [];
      let prev = -1;
      for (let x = 16 + r() * 10, i = 0; x < W - 10; x += gap * (0.75 + r() * 0.5), i++) {
        let c;
        do { c = colors[Math.floor(r() * 3)]; } while (c === prev);
        prev = c;
        list.push({ x, L: 30 + r() * 44, r: 8 + r() * 6, c, stripe: c === 'navy' && r() < 0.5 });
      }
      list.forEach((b, i) => {
        const x = Math.round(b.x);
        const y0 = stemY(x) + 3;
        const L = b.L * k, rad = b.r * k;
        const cy = y0 + L + 5 + rad;
        const dur = (4 + (i % 3) * 1.1).toFixed(1);
        const amp = (6 - Math.min(L, 80) / 25).toFixed(1);
        out += `<g class="ornament" style="transform-origin:${x}px ${y0}px;--dur:${dur}s;--delay:-${(i * 0.7).toFixed(1)}s;--amp:${amp}deg">
          <line x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + L + 1}" stroke="#8a8f98" stroke-width="1"/>
          <rect x="${x - 3.5 * k}" y="${y0 + L}" width="${7 * k}" height="${6 * k}" rx="1" fill="#b9bec6"/>
          <circle cx="${x}" cy="${cy}" r="${rad}" fill="url(#g-${b.c})"/>
          ${b.stripe ? `<path d="M${x - rad} ${cy} Q${x} ${cy + rad * 0.35} ${x + rad} ${cy}" stroke="#f97316" stroke-width="${2.2 * k}" fill="none"/>` : ''}
          <ellipse cx="${x - rad * 0.35}" cy="${cy - rad * 0.4}" rx="${rad * 0.22}" ry="${rad * 0.13}" fill="#fff" opacity=".7" transform="rotate(-30 ${x - rad * 0.35} ${cy - rad * 0.4})"/>
        </g>`;
      });
      svg.innerHTML = out;
    }

    /* ---- Snow ---- */
    const cv = document.getElementById('snow');
    const ctx = cv.getContext('2d');
    let flakes = [], W = 0, H = 0, dpr = 1;

    function flake(anywhere) {
      const z = Math.random();                 // depth: 0 far … 1 near
      return {
        x: Math.random() * W,
        y: anywhere ? Math.random() * H : -20,
        z,
        glyph: Math.random() < 0.3,
        size: 1 + z * 2.4,
        vy: 0.25 + z * 0.9,
        amp: 0.3 + Math.random() * 0.8,
        ph: Math.random() * Math.PI * 2,
        a: 0.35 + z * 0.5
      };
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(W * H / 9000);
      flakes = Array.from({ length: n }, () => flake(true));
      drawGarland(W);
      drawBaubles(W);
      if (reduce) draw(false);
    }

    function draw(move = true) {
      ctx.clearRect(0, 0, W, H);
      for (const f of flakes) {
        if (move) {
          f.y += f.vy; f.ph += 0.012;
          f.x += Math.sin(f.ph) * f.amp * 0.4;
          if (f.y > H + 20) Object.assign(f, flake(false));
        }
        ctx.fillStyle = `rgba(143, 166, 191, ${f.a})`;
        if (f.glyph) {
          ctx.font = `700 ${Math.round(8 + f.z * 9)}px "Roboto Mono", monospace`;
          ctx.fillText('*', f.x, f.y);
        } else {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function loop() { draw(); requestAnimationFrame(loop); }

    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(resize, 120); });
    resize();
    if (!reduce) requestAnimationFrame(loop);
  })();
  </script>
</body>
