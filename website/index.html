<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dmitrii Bleshchunov — Software Engineer. Dmitrii Bleshchunov PR Subotica." />
<meta property="og:title" content="Dmitrii Bleshchunov — Software Engineer" />
<meta property="og:description" content="Dmitrii Bleshchunov PR Subotica · Software Engineer" />
<meta property="og:image" content="https://b8v.dev/preview.png" />
<meta property="og:type" content="profile" />
<meta property="og:url" content="https://b8v.dev" />

<title>Dmitrii Bleshchunov — Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<script src="/winter.js" data-mode="card"></script>
<style>
  :root {
    --navy: #131f2d;
    --orange: #f97316;
    --body-text: #2b2b2b;
    --divider: #e5e5e5;
    --muted: #8a8f98;
    --paper: #fdfdfb;
    --page: #f3f3f1;

    --pad: 20px;
    --icon-size: 32px;
  }

  @media (min-width: 768px) {
    :root { --pad: 64px; --icon-size: 40px; }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--body-text);
    font-family: 'Roboto Mono', 'Courier New', monospace;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 40px var(--pad);
    min-height: 100vh;
    border-top: 4px solid var(--orange);
  }

  /* ===== Card ===== */
  /* .stage is the size container for the card's own padding and for .actions,
     so text inside the card and the row below share one left edge */
  .stage {
    container-type: inline-size;
    width: min(880px, 100%);
    display: flex;
    flex-direction: column;
    gap: 0;
    --inset: 7.5cqw;
  }

  /* ===== Flip + tilt ===== */
  .flip {
    --t: clamp(22px, 7cqw, 44px);   /* card thickness: a solid block */
    position: relative;
    width: 100%;
    aspect-ratio: 1.75 / 1;
    /* far camera (relative to card width): edges show from ~6° of tilt */
    perspective: 450cqw;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .flip-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* soft shadow on the "table": stays flat, slides opposite to the tilt */
  .flip-shadow {
    position: absolute;
    left: -8%; right: -8%; top: 4%; bottom: -16%;
    background: radial-gradient(closest-side, rgba(19, 31, 45, 0.34), rgba(19, 31, 45, 0.2) 45%, rgba(19, 31, 45, 0.07) 75%, rgba(19, 31, 45, 0));
    transform: translate(var(--sx, 0px), var(--sy, 18px)) scaleX(var(--ss, 1));
    pointer-events: none;
  }

  /* card edges: four thin faces that give the card its thickness */
  .edge {
    position: absolute;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    pointer-events: none;
  }
  .edge-l, .edge-r {
    top: 0; bottom: 0;
    width: var(--t);
    background:
      repeating-linear-gradient(to right, rgba(19, 31, 45, 0.07) 0 1px, transparent 1px 3px),
      linear-gradient(to right, #e4e3dc, #f2f1eb 50%, #e4e3dc);
  }
  .edge-t, .edge-b {
    left: 0; right: 0;
    height: var(--t);
    background:
      repeating-linear-gradient(to bottom, rgba(19, 31, 45, 0.07) 0 1px, transparent 1px 3px),
      linear-gradient(to bottom, #e6e5de, #f4f3ed 50%, #e6e5de);
  }
  .edge-l { filter: brightness(0.95); }
  .edge-r { filter: brightness(0.87); }
  .edge-t { filter: brightness(1); }
  .edge-l { left: calc(var(--t) / -2); transform: rotateY(-90deg); }
  .edge-r { left: calc(100% - var(--t) / 2); transform: rotateY(90deg); }
  .edge-t { top: calc(var(--t) / -2); transform: rotateX(90deg); }
  .edge-b { top: calc(100% - var(--t) / 2); transform: rotateX(-90deg); filter: brightness(0.83); }

  .card {
    container-type: inline-size;
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background-color: var(--paper);
    /* laid-paper texture, like the printed card */
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(19, 31, 45, 0.035) 0px,
      rgba(19, 31, 45, 0.035) 1px,
      transparent 1px,
      transparent 4px
    );
    border-radius: 1px;
    box-shadow: none;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "logo   logo"
      "person person"
      "org    phone";
    padding: 7cqw var(--inset) 6cqw var(--inset);
  }

  /* light that follows the tilt */
  .glare {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: var(--ga, 0);
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 45%, rgba(19, 31, 45, 0.07) 100%);
  }

  .card.front { transform: translateZ(calc(var(--t) / 2 - 0.5px)); }

  .flip-btn {
    position: absolute;
    bottom: 2.2cqw;
    right: var(--inset);
    font: inherit;
    font-size: 1.5cqw;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 0;
    padding: 0.6cqw 0;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .flip-btn:hover, .flip-btn:focus-visible { color: var(--orange); outline: none; }

  #b8v-snow { transition: opacity 0.4s ease; }
  html.qr-open #b8v-snow { opacity: 0; }

  /* ===== Back side ===== */
  .card.back {
    transform: rotateY(180deg) translateZ(calc(var(--t) / 2 - 0.5px));
    grid-template-columns: auto 1fr;
    grid-template-rows: 1fr;
    grid-template-areas: "qr text";
    align-items: center;
    column-gap: 5cqw;
  }

  .back-qr {
    grid-area: qr;
    width: 33cqw;
    padding: 1.6cqw;
    background: #fff;
    border-radius: 4px;
    color: var(--navy);
    box-shadow: 0 0 0 1px rgba(19, 31, 45, 0.06);
  }
  .back-qr svg { display: block; width: 100%; height: auto; }

  .back-text { grid-area: text; }

  .back-kicker {
    color: var(--orange);
    font-weight: 700;
    font-size: 1.6cqw;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 2cqw;
  }

  .back-name {
    margin: 0 0 1cqw;
    color: var(--navy);
    font-weight: 700;
    font-size: 3cqw;
    line-height: 1.2;
  }

  .back-sub {
    margin: 0;
    font-size: 1.95cqw;
    line-height: 1.7;
  }

  /* ===== Logo (same animation as b8v.dev) ===== */
  .logo-row {
    grid-area: logo;
    display: flex;
    align-items: center;
    gap: 2.2cqw;
  }

  .b8v-logo {
    position: relative;
    display: inline-block;
    width: 10ch;
    height: 1.2em;
    font-weight: 700;
    font-size: 3.6cqw;
    line-height: 1.2;
    color: var(--navy);
    white-space: nowrap;
    letter-spacing: 0;
  }

  .b8v-logo span { position: absolute; top: 0; }
  .b8v-b { left: 0ch; }

  .b8v-eight {
    left: 1ch;
    color: var(--orange);
    animation: b8v-fade-out 0.4s ease forwards;
    animation-delay: 0.3s;
  }

  .b8v-v {
    left: 2ch;
    animation: b8v-slide-v 0.65s cubic-bezier(.65, 0, .35, 1) forwards;
    animation-delay: 0.75s;
  }

  .b8v-middle {
    opacity: 0;
    transform: translateY(4px);
    animation: b8v-fade-in-up 0.35s ease forwards;
  }
  .b8v-middle:nth-child(4)  { left: 1ch; animation-delay: 0.95s; }
  .b8v-middle:nth-child(5)  { left: 2ch; animation-delay: 1.00s; }
  .b8v-middle:nth-child(6)  { left: 3ch; animation-delay: 1.05s; }
  .b8v-middle:nth-child(7)  { left: 4ch; animation-delay: 1.10s; }
  .b8v-middle:nth-child(8)  { left: 5ch; animation-delay: 1.15s; }
  .b8v-middle:nth-child(9)  { left: 6ch; animation-delay: 1.20s; }
  .b8v-middle:nth-child(10) { left: 7ch; animation-delay: 1.25s; }
  .b8v-middle:nth-child(11) { left: 8ch; animation-delay: 1.30s; }

  @keyframes b8v-fade-out   { to { opacity: 0; } }
  @keyframes b8v-slide-v    { to { left: 9ch; } }
  @keyframes b8v-fade-in-up { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .b8v-eight { animation: none; opacity: 0; }
    .b8v-v { animation: none; left: 9ch; }
    .b8v-middle { animation: none; opacity: 1; transform: none; }
  }

  /* ===== Person ===== */
  .person {
    grid-area: person;
    align-self: center;
  }

  .name {
    margin: 0 0 1.2cqw;
    color: var(--navy);
    font-weight: 700;
    font-size: 3.6cqw;
    line-height: 1.2;
  }

  .role {
    margin: 0;
    color: var(--body-text);
    font-size: 2.2cqw;
    line-height: 1.5;
  }

  .role::before {
    content: "";
    display: inline-block;
    width: 2.4cqw;
    height: 2px;
    background: var(--orange);
    vertical-align: middle;
    margin-right: 1.2cqw;
    transform: translateY(-0.15em);
  }

  /* ===== Bottom block ===== */
  .org {
    grid-area: org;
    align-self: end;
    font-size: 1.95cqw;
    line-height: 1.7;
    color: var(--body-text);
    font-style: normal;
  }

  .org .entity { color: var(--navy); font-weight: 700; }

  .phone {
    grid-area: phone;
    align-self: end;
    font-size: 1.95cqw;
    line-height: 1.7;
    white-space: nowrap;
  }

  .card a {
    color: inherit;
    text-decoration: none;
    background-image: linear-gradient(var(--orange), var(--orange));
    background-size: 0% 1px;
    background-position: 0 100%;
    background-repeat: no-repeat;
    transition: background-size 0.25s ease, color 0.2s ease;
  }

  .card a:hover,
  .card a:focus-visible {
    color: var(--orange);
    background-size: 100% 1px;
    outline: none;
  }

  .phone .label { color: var(--muted); }

  /* ===== Below the card ===== */
  .stage { --gap-card: 40px; --gap-status: 22px; }
  .stage .actions { margin-top: var(--gap-card); }
  #status { padding: 0 var(--inset); margin-top: var(--gap-status); flex-shrink: 0; }

  .actions {
    width: 100%;
    padding: 0 var(--inset);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .social-icons { display: flex; gap: 10px; }

  .social-icons a {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 50%;
    background: var(--navy);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-weight: 700;
    font-size: calc(var(--icon-size) * 0.34);
    transition: background 0.2s ease;
  }

  .social-icons a:hover,
  .social-icons a:focus-visible { background: var(--orange); }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .save {
    display: inline-block;
    text-decoration: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--navy);
    background: transparent;
    border: 1.5px solid var(--navy);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .save:hover,
  .save:focus-visible {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    outline: none;
  }


  /* ===== Mobile: the card turns vertical ===== */
  @media (max-width: 640px) {
    /* fit the whole page into one screen: no vertical scroll */
    body {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      justify-content: flex-start;
      gap: 14px;
      padding: 24px 20px calc(16px + env(safe-area-inset-bottom));
    }

    .stage { flex: 1 1 0; min-height: 0; gap: 0; --inset: 9cqw; --gap-card: 30px; --gap-status: 18px; }

    .flip { aspect-ratio: auto; flex: 1 1 0; min-height: 0; }

    .card {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto auto;
      grid-template-areas:
        "logo"
        "person"
        "org"
        "phone";
      padding: 11cqw var(--inset) 10cqw;
    }

    .logo-row { gap: 3.5cqw; }
    .b8v-logo { font-size: 7.2cqw; }

    .person, .org { padding-left: 0; }
    .name { font-size: 7.2cqw; margin-bottom: 2.4cqw; }
    .role { font-size: 4.4cqw; }
    .role::before { width: 5cqw; margin-right: 2.4cqw; }

    .org, .phone { font-size: 3.9cqw; }

    .flip-btn { bottom: 10cqw; font-size: 3.2cqw; padding: 1.2cqw 0; }

    /* the back is a size container: the QR takes whatever height is left
       after the text, so nothing spills out of the card on short screens */
    .card.back {
      container-type: size;
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "qr" "text";
      align-items: center;
      row-gap: 6cqw;
    }
    .back-qr {
      width: min(100%, calc(100cqh - 30cqw));
      min-width: 40cqw;
      padding: 3.5cqw;
      align-self: center;
    }
    .back-kicker { font-size: 3.4cqw; margin-bottom: 3cqw; }
    .back-name { font-size: 6cqw; margin-bottom: 2cqw; }
    .back-sub { font-size: 3.9cqw; }
    .phone { margin-top: 2.4cqw; }

    .actions { flex-direction: column; align-items: flex-start; gap: 16px; flex-shrink: 0; }
    .buttons { justify-content: flex-start; }
    .save { padding: 9px 16px; font-size: 12px; }
  }

  /* ===== Print: a real 85 × 55 mm card ===== */
  @media print {
    @page { size: 85mm 55mm; margin: 0; }
    body { background: #fff; padding: 0; border: 0; min-height: 0; display: block; }
    .stage { display: block; width: auto; }
    .flip { width: 85mm; aspect-ratio: 85 / 55; perspective: none; }
    .flip-inner { transform: none !important; }
    .card.back, .flip-btn, .glare, .edge, .flip-shadow { display: none !important; }
    .card.front { transform: none; }
    .card { box-shadow: none; border-radius: 0; background-image: none; }
    .actions { display: none; }
    .b8v-eight { animation: none; opacity: 0; }
    .b8v-v { animation: none; left: 9ch; }
    .b8v-middle { animation: none; opacity: 1; transform: none; }
  }
</style>
<script src="/status.js" defer></script>
</head>

  <script>
  /* Card: flip on tap/click, tilt after the phone's gyroscope or the cursor */
  (() => {
    const flip = document.getElementById('flip');
    const inner = flip.querySelector('.flip-inner');
    const front = flip.querySelector('.card.front');
    const back = flip.querySelector('.card.back');
    const btnFront = front.querySelector('.flip-btn');
    const btnBack = back.querySelector('.flip-btn');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clamp = (v, a) => Math.max(-a, Math.min(a, v));

    let flipped = false;
    const tgt = { rx: 0, ry: 0, f: 0 };
    const cur = { rx: 0, ry: 0, f: 0 };

    function setFlipped(v, fromKeyboard) {
      flipped = v;
      tgt.f = v ? 180 : 0;
      front.setAttribute('aria-hidden', String(v));
      back.setAttribute('aria-hidden', String(!v));
      btnFront.tabIndex = v ? -1 : 0;
      btnBack.tabIndex = v ? 0 : -1;
      // snow fades out while the QR is shown, so nothing covers the code
      document.documentElement.classList.toggle('qr-open', v);
      if (fromKeyboard) (v ? btnBack : btnFront).focus({ preventScroll: true });
    }

    flip.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;          // links on the card keep working
      enableGyro();
      setFlipped(!flipped, e.detail === 0);
    });

    /* --- cursor (desktop) --- */
    window.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const nx = clamp((e.clientX / innerWidth) * 2 - 1, 1);
      const ny = clamp((e.clientY / innerHeight) * 2 - 1, 1);
      tgt.ry = nx * 18;
      tgt.rx = -ny * 12;
    });
    document.addEventListener('mouseleave', () => { tgt.rx = 0; tgt.ry = 0; });

    /* --- gyroscope (phones) --- */
    let base = null, gyroOn = false;
    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      if (!base) base = { b: e.beta, g: e.gamma };
      // the reference is fixed: the card stays turned as long as the phone does
      // counter-rotate: the card keeps "looking" at you while the phone tilts
      tgt.ry = -clamp(e.gamma - base.g, 30) * 0.9;
      tgt.rx = clamp(e.beta - base.b, 30) * 0.7;
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) base = null; });
    function listen() {
      if (gyroOn) return;
      gyroOn = true;
      window.addEventListener('deviceorientation', onOrientation);
    }
    // Listen right away: Android sends events without asking. iOS only sends
    // them after permission, which Safari lets us request from a tap.
    let asked = false;
    function enableGyro() {
      const DOE = window.DeviceOrientationEvent;
      if (!DOE || reduce || asked || typeof DOE.requestPermission !== 'function') return;
      asked = true;
      DOE.requestPermission().catch(() => {});
    }
    if (window.DeviceOrientationEvent && !reduce) listen();
    document.addEventListener('click', (e) => { if (!e.target.closest('a')) enableGyro(); });

    /* --- render loop --- */
    let half = 0;
    const edge = flip.querySelector('.edge-l');
    const measure = () => { half = edge.offsetWidth / 2; };
    measure();
    window.addEventListener('resize', measure);
    function frame() {
      const k = reduce ? 1 : 0.1;
      cur.rx += ((reduce ? 0 : tgt.rx) - cur.rx) * k;
      cur.ry += ((reduce ? 0 : tgt.ry) - cur.ry) * k;
      cur.f += (tgt.f - cur.f) * (reduce ? 1 : 0.12);
      if (Math.abs(tgt.f - cur.f) < 0.05) cur.f = tgt.f;
      // faces sit at ±t/2; shifting by -t/2 keeps the visible face in the page plane,
      // so its text lines up exactly with the icons and buttons below
      inner.style.transform = `translateZ(${-half}px) rotateX(${cur.rx.toFixed(2)}deg) rotateY(${(cur.ry + cur.f).toFixed(2)}deg)`;
      const side = cur.f > 90 ? -1 : 1;
      inner.style.setProperty('--gx', `${50 + cur.ry * 3.5 * side}%`);
      inner.style.setProperty('--gy', `${50 - cur.rx * 4}%`);
      flip.style.setProperty('--sx', `${(-cur.ry * 1.3).toFixed(1)}px`);
      flip.style.setProperty('--sy', `${(16 + cur.rx * 1.3).toFixed(1)}px`);
      flip.style.setProperty('--ss', (0.35 + 0.65 * Math.abs(Math.cos(cur.f * Math.PI / 180))).toFixed(3));
      inner.style.setProperty('--ga', Math.min(0.55, (Math.abs(cur.rx) + Math.abs(cur.ry)) / 22).toFixed(3));
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
