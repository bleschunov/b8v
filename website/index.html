<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bleschunov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #131f2d;
    --orange: #f97316;
    --body-text: #2b2b2b;
    --divider: #e5e5e5;
    --muted: #8a8f98;

    --header-h: 64px;
    --pad: 20px;
    --name-size: 20px;
    --icon-size: 32px;
    --date-size: 13px;
    --title-size: 18px;
    --body-size: 15px;
    --body-lh: 26px;
    --feed-gap: 28px;
  }

  @media (min-width: 768px) {
    :root {
      --header-h: 88px;
      --pad: 64px;
      --name-size: 26px;
      --icon-size: 40px;
      --date-size: 14px;
      --title-size: 20px;
      --body-size: 17px;
      --body-lh: 30px;
      --feed-gap: 40px;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--body-text);
    font-family: 'Roboto Mono', 'Courier New', monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--pad);
    background: #ffffff;
    border-top: 4px solid var(--orange);
  }

  .social-icons {
    display: flex;
    gap: 10px;
  }

  .social-icons a {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 50%;
    background: var(--navy);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-weight: 700;
    font-size: calc(var(--icon-size) * 0.34);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }

  .social-icons a:hover,
  .social-icons a:focus-visible {
    background: var(--orange);
  }

  /* ===== Logo animation (pure CSS) ===== */
  .b8v-logo {
    position: relative;
    display: inline-block;
    width: 10ch;
    height: 1.2em;
    font-weight: 700;
    font-size: var(--name-size);
    line-height: 1.2;
    color: var(--navy);
    white-space: nowrap;
  }

  .b8v-logo span {
    position: absolute;
    top: 0;
  }

  .b8v-b { left: 0ch; }

  .b8v-eight {
    left: 1ch;
    color: var(--orange);
    opacity: 1;
    animation: b8v-fade-out 0.4s ease forwards;
    animation-delay: 0.3s;
  }

  .b8v-v {
    left: 2ch;
    animation: b8v-slide-v 0.65s cubic-bezier(.65, 0, .35, 1) forwards;
    animation-delay: 0.75s;
  }

  .b8v-middle {
    opacity: 0;
    transform: translateY(4px);
    animation: b8v-fade-in-up 0.35s ease forwards;
  }
  .b8v-middle:nth-child(4)  { left: 1ch; animation-delay: 0.95s; } /* l */
  .b8v-middle:nth-child(5)  { left: 2ch; animation-delay: 1.00s; } /* e */
  .b8v-middle:nth-child(6)  { left: 3ch; animation-delay: 1.05s; } /* s */
  .b8v-middle:nth-child(7)  { left: 4ch; animation-delay: 1.10s; } /* c */
  .b8v-middle:nth-child(8)  { left: 5ch; animation-delay: 1.15s; } /* h */
  .b8v-middle:nth-child(9)  { left: 6ch; animation-delay: 1.20s; } /* u */
  .b8v-middle:nth-child(10) { left: 7ch; animation-delay: 1.25s; } /* n */
  .b8v-middle:nth-child(11) { left: 8ch; animation-delay: 1.30s; } /* o */

  @keyframes b8v-fade-out { to { opacity: 0; } }
  @keyframes b8v-slide-v { to { left: 9ch; } }
  @keyframes b8v-fade-in-up { to { opacity: 1; transform: translateY(0); } }

  /* ===== Feed ===== */
  main {
    display: flex;
    justify-content: start;
    padding: 40px var(--pad) 64px;
  }

  .feed {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: var(--feed-gap);
  }

  .post {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  @media (min-width: 768px) {
    .post { gap: 12px; }
  }

  .post .date {
    color: var(--orange);
    font-weight: 700;
    font-size: var(--date-size);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .post .title {
    color: var(--navy);
    font-weight: 700;
    font-size: var(--title-size);
    line-height: 1.3;
  }

  .post p {
    color: var(--body-text);
    font-weight: 400;
    font-size: var(--body-size);
    line-height: var(--body-lh);
    margin: 0;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--divider);
    margin: 0;
  }

  /* ===== Loading indicator ===== */
  .loading-row {
    display: flex;
    align-items: center;
    justify-content: start;
    gap: 8px;
    padding: 4px 0 20px;
    color: var(--muted);
    font-size: var(--date-size);
    min-height: 40px;
  }

  .loading-row.is-hidden { display: none; }

  .dots {
    display: flex;
    gap: 4px;
  }

  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    animation: dot-pulse 1.1s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes dot-pulse {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  #sentinel {
    height: 1px;
  }
</style>
</head>
<body>

  <header>
    <div class="b8v-logo" aria-label="bleschunov">
      <span class="b8v-b">b</span>
      <span class="b8v-eight">8</span>
      <span class="b8v-v">v</span>
      <span class="b8v-middle">l</span>
      <span class="b8v-middle">e</span>
      <span class="b8v-middle">s</span>
      <span class="b8v-middle">c</span>
      <span class="b8v-middle">h</span>
      <span class="b8v-middle">u</span>
      <span class="b8v-middle">n</span>
      <span class="b8v-middle">o</span>
    </div>

    <div class="social-icons">
      <a href="https://www.linkedin.com/in/d-bleshchunov/" aria-label="LinkedIn">in</a>
      <a href="https://www.youtube.com/" aria-label="YouTube">YT</a>
      <a href="https://github.com/bleschunov" aria-label="GitHub">GH</a>
    </div>
  </header>

  <main>
    <div class="feed" id="feed">
      <div class="loading-row" id="loadingRow">
        <div class="dots"><span></span><span></span><span></span></div>
        <span>Loading posts…</span>
      </div>
    </div>
  </main>

  <div id="sentinel"></div>

  <script>
    const feed = document.getElementById('feed');

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso; // на случай нестандартного формата с бэка
      return d.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      }).toUpperCase().replace(',', ',');
    }

    function renderPost(post) {
      const article = document.createElement('article');
      article.className = 'post';

      const dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.textContent = formatDate(post.posted_at);

      const titleEl = document.createElement('div');
      titleEl.className = 'title';
      titleEl.textContent = post.title;

      const contentEl = document.createElement('div');
      contentEl.innerHTML = post.content;

      article.appendChild(dateEl);
      article.appendChild(titleEl);
      article.appendChild(contentEl);
      return article;
    }

    async function loadPosts() {
      try {
        const res = await fetch('https://api.b8v.dev/posts');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const posts = await res.json();

        feed.innerHTML = '';

        posts.forEach((post, i) => {
          feed.appendChild(renderPost(post));
          if (i < posts.length - 1) {
            const hr = document.createElement('hr');
            hr.className = 'divider';
            feed.appendChild(hr);
          }
        });
      } catch (err) {
        console.error('Failed to load posts:', err);
        feed.innerHTML = '<p style="color: var(--muted);">No posts yet or couldn\'t fetch them :(</p>';
      }
    }
    loadPosts();
  </script>
</body>
</html>
